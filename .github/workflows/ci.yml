name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# GITHUB_TOKEN needs write to create releases from the release job.
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime deps (gjs + GIO typelibs for the shared cli/ core)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gjs \
            gir1.2-secret-1 \
            gir1.2-soup-3.0 \
            libglib2.0-dev-bin \
            zip

      - name: Dependency check (gjs/python3/openssl + typelibs)
        run: make check-deps

      - name: GNOME test suite (gjs)
        run: make test

      - name: Plasma widget parity tests (node)
        run: make test-plasma

      - name: Package (GNOME zip + Plasma plasmoid)
        run: make zip zip-plasma

      - uses: actions/upload-artifact@v4
        with:
          name: packages-test
          path: |
            dist/*.zip
            dist/*.plasmoid

  # Attaches the built packages to the tagged GitHub release. Runs only
  # for v* tag pushes and only after the test job is green.
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps (schema compiler + zip)
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev-bin zip

      - name: Build packages
        run: make zip zip-plasma

      - name: Attach packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          sha256sum dist/*.zip dist/*.plasmoid > dist/sha256sums.txt
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" \
              --title "$TAG — CLI core + GNOME extension + Plasma widget" \
              --generate-notes \
              --latest \
              "dist/ollama-cloud-usage-tracker@aquelehugo.github.io.zip" \
              "dist/ollama.cloud.usage.tracker.plasmoid" \
              "dist/sha256sums.txt"
          fi